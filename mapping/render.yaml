# Render Blueprint for the Mappingg Next.js app.
# IMPORTANT: this is a PRODUCTION Next.js server — it must run `next start`
# (via `npm run start`), NOT `next dev`. Running dev mode on Render breaks CSS
# handling and binds to localhost, causing a Bad Gateway.
services:
  - type: web
    name: mappingg
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      # Secrets — set the real values in the Render dashboard (Environment tab).
      # They are NOT committed to git, so they must be added there.
      # DATABASE_URL is the Postgres (Prisma Postgres) connection the app uses.
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      # MONGODB_* are no longer used by the running app (migration only).
      - key: NEXT_PUBLIC_SITE_URL
        value: https://mapping-8vm5.onrender.com
      - key: NEXT_PUBLIC_GOOGLE_MAPS_KEY
        sync: false
      - key: NODE_VERSION
        value: 20.18.0
