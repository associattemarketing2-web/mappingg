# Render Blueprint for the Mappingg Next.js app + WhatsApp gateway.
# `npm run start` runs both in this one service: the website on $PORT and the
# WhatsApp gateway (gateway/) on 127.0.0.1:8099, reachable only from the site.
# The gateway keeps WhatsApp connected 24/7, so this needs a plan that never
# sleeps (Starter or above) — the free plan sleeps and logs the numbers out.
# IMPORTANT: this is a PRODUCTION Next.js server — it must run `next start`
# (via `npm run start`), NOT `next dev`. Running dev mode on Render breaks CSS
# handling and binds to localhost, causing a Bad Gateway.
services:
  - type: web
    name: mappingg
    runtime: node
    plan: starter
    # Only ONE copy may hold the WhatsApp logins (wl_gateway_lease enforces it).
    numInstances: 1
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      # Secrets — set the real values in the Render dashboard (Environment tab).
      # They are NOT committed to git, so they must be added there.
      # DATABASE_URL is the Postgres (Prisma Postgres) connection the app uses.
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      # HR & Attendance (/dashboard/hr): the employee-management Postgres database.
      - key: HR_DATABASE_URL
        sync: false
      # The app runs on Postgres only. MongoDB is used solely when
      # DB_PROVIDER=mongodb is set explicitly (see lib/mongodb.ts).
      - key: DB_PROVIDER
        value: postgres
      - key: NEXT_PUBLIC_SITE_URL
        value: https://mapping-8vm5.onrender.com
      - key: NEXT_PUBLIC_GOOGLE_MAPS_KEY
        sync: false
      # Google sign-in (OAuth). Redirect URI to whitelist in Google Cloud:
      #   <NEXT_PUBLIC_SITE_URL>/api/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Email (Gmail SMTP + App password) — OTP codes and notifications.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
      # Sales CRM (B2BBricks) webhook new leads are posted to (see lib/crm.ts).
      - key: CRM_WEBHOOK_URL
        sync: false
      # Subscriptions & payments (PAYMENT-GATEWAY-SETUP.md). Without keys, paid
      # plans show "payments are being set up"; free plans keep working.
      - key: PAYMENT_GATEWAY
        value: razorpay
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_RAZORPAY_KEY_ID
        sync: false
      # Bearer token for GET /api/subscriptions/cron (run it daily from an external scheduler on Render).
      - key: CRON_SECRET
        sync: false
      # WhatsApp gateway (s-admin → Communication → WhatsApp Inbox).
      # WA_GATEWAY_URL is set automatically by `npm run start` — don't add it.
      - key: WA_GATEWAY_SECRET
        generateValue: true
      # Encrypts the WhatsApp logins. Paste the SAME value as in your .env —
      # a different key logs every linked number out.
      - key: WA_GATEWAY_KEY
        sync: false
      # Must match package.json "engines" (24.x) and .nvmrc.
      - key: NODE_VERSION
        value: "24"
